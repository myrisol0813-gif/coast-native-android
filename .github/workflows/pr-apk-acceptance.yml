name: PR APK acceptance

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Read app version
        id: app_version
        shell: bash
        run: |
          set -euo pipefail
          version_code=$(sed -nE 's/^[[:space:]]*versionCode = ([0-9]+)[[:space:]]*$/\1/p' app/build.gradle.kts | head -n 1)
          version_name=$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)"[[:space:]]*$/\1/p' app/build.gradle.kts | head -n 1)
          test -n "$version_code"
          test -n "$version_name"
          echo "COAST_VERSION_CODE=$version_code" >> "$GITHUB_ENV"
          echo "COAST_VERSION_NAME=$version_name" >> "$GITHUB_ENV"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"

      - name: Configure stable Android signing
        shell: bash
        env:
          COAST_ANDROID_KEYSTORE_B64: ${{ secrets.COAST_ANDROID_KEYSTORE_B64 }}
          COAST_ANDROID_KEYSTORE_PASSWORD_SECRET: ${{ secrets.COAST_ANDROID_KEYSTORE_PASSWORD }}
          COAST_ANDROID_KEY_ALIAS_SECRET: ${{ secrets.COAST_ANDROID_KEY_ALIAS }}
          COAST_ANDROID_KEY_PASSWORD_SECRET: ${{ secrets.COAST_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${COAST_ANDROID_KEYSTORE_B64:-}"
          test -n "${COAST_ANDROID_KEYSTORE_PASSWORD_SECRET:-}"
          test -n "${COAST_ANDROID_KEY_ALIAS_SECRET:-}"
          test -n "${COAST_ANDROID_KEY_PASSWORD_SECRET:-}"
          key_path="$RUNNER_TEMP/coast-stable.jks"
          printf '%s' "$COAST_ANDROID_KEYSTORE_B64" | base64 --decode > "$key_path"
          chmod 600 "$key_path"
          {
            echo "COAST_ANDROID_KEYSTORE_PATH=$key_path"
            echo "COAST_ANDROID_KEYSTORE_PASSWORD=$COAST_ANDROID_KEYSTORE_PASSWORD_SECRET"
            echo "COAST_ANDROID_KEY_ALIAS=$COAST_ANDROID_KEY_ALIAS_SECRET"
            echo "COAST_ANDROID_KEY_PASSWORD=$COAST_ANDROID_KEY_PASSWORD_SECRET"
          } >> "$GITHUB_ENV"

      - name: Assemble signed debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Sign and verify acceptance APK
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$sdk_root"
          build_tools_dir=$(find "$sdk_root/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          apksigner="$build_tools_dir/apksigner"
          test -x "$apksigner"
          test -f app/build/outputs/apk/debug/app-debug.apk

          mkdir -p artifact
          apk="artifact/CoastGPT-native-${COAST_VERSION_NAME}-debug.apk"
          "$apksigner" sign \
            --ks "$COAST_ANDROID_KEYSTORE_PATH" \
            --ks-key-alias "$COAST_ANDROID_KEY_ALIAS" \
            --ks-pass env:COAST_ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:COAST_ANDROID_KEY_PASSWORD \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$apk" \
            app/build/outputs/apk/debug/app-debug.apk

          verify_output=$("$apksigner" verify --verbose --print-certs "$apk")
          printf '%s\n' "$verify_output"
          grep -Fq 'Verified using v1 scheme (JAR signing): true' <<<"$verify_output"
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' <<<"$verify_output"
          grep -Fq 'Verified using v3 scheme (APK Signature Scheme v3): true' <<<"$verify_output"
          unzip -Z1 "$apk" | grep -Eq '^META-INF/.*\.(SF|RSA|DSA|EC)$'

          sha256sum "$apk" > artifact/SHA256SUMS.txt
          printf 'stable_signing=true\nsignature_verified=true\nv1_signature_file=true\nversionName=%s\nversionCode=%s\napplicationId=com.elementeracoast.app\n' "$COAST_VERSION_NAME" "$COAST_VERSION_CODE" > artifact/BUILD_INFO.txt

      - name: Publish acceptance APK as prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="coast-post-v1-acceptance-${COAST_VERSION_CODE}"
          title="Elementera Coast Native ${COAST_VERSION_NAME} acceptance"
          apk="artifact/CoastGPT-native-${COAST_VERSION_NAME}-debug.apk"
          notes="Post-V1 real-device acceptance APK for PR #${{ github.event.pull_request.number }}. Signature verified with v1/v2/v3. versionCode=${COAST_VERSION_CODE}."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" artifact/SHA256SUMS.txt artifact/BUILD_INFO.txt --clobber
          else
            gh release create "$tag" "$apk" artifact/SHA256SUMS.txt artifact/BUILD_INFO.txt \
              --target "${{ github.event.pull_request.head.sha }}" \
              --title "$title" \
              --notes "$notes" \
              --prerelease
          fi
