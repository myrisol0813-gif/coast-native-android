name: Temporary context test contract

on:
  push:
    branches:
      - fix/context-budget-token-footer-0137

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/context-budget-token-footer-0137
      - name: Update fake chat signature
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/src/test/kotlin/com/elementeracoast/app/feature/shell/CoastShellViewModelTest.kt')
          text = p.read_text()
          text = text.replace('''        var lastRecentTurns = 0
''', '''        var lastRecentTurns = 0
        var lastContextBudget = 0
''', 1)
          text = text.replace('''            modelId: String,
            recentTurns: Int
        ): Flow<ChatProgress> = flow {
            streamCalls += 1
            lastRecentTurns = recentTurns
''', '''            modelId: String,
            recentTurns: Int,
            contextBudget: Int
        ): Flow<ChatProgress> = flow {
            streamCalls += 1
            lastRecentTurns = recentTurns
            lastContextBudget = contextBudget
''', 1)
          p.write_text(text)
          PY
      - name: Commit exact test patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/test/kotlin/com/elementeracoast/app/feature/shell/CoastShellViewModelTest.kt
          git commit -m "Update Native context-control test contract"
          git push origin HEAD:fix/context-budget-token-footer-0137
