name: Temporary context test contract

on:
  push:
    branches:
      - fix/context-budget-token-footer-0137

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/context-budget-token-footer-0137
      - name: Update fake chat signature
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/src/test/kotlin/com/elementeracoast/app/feature/shell/CoastShellViewModelTest.kt')
          text = p.read_text()
          text = text.replace("        var lastRecentTurns = 0\n", "        var lastRecentTurns = 0\n        var lastContextBudget = 0\n", 1)
          old = "            modelId: String,\n            recentTurns: Int\n        ): Flow<ChatProgress> = flow {\n            streamCalls += 1\n            lastRecentTurns = recentTurns\n"
          new = "            modelId: String,\n            recentTurns: Int,\n            contextBudget: Int\n        ): Flow<ChatProgress> = flow {\n            streamCalls += 1\n            lastRecentTurns = recentTurns\n            lastContextBudget = contextBudget\n"
          if old not in text:
              raise SystemExit('expected FakeChatRepository signature not found')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Commit exact test patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/test/kotlin/com/elementeracoast/app/feature/shell/CoastShellViewModelTest.kt
          git commit -m "Update Native context-control test contract"
          git push origin HEAD:fix/context-budget-token-footer-0137
