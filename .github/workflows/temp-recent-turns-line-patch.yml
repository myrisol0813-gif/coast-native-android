name: Temporary recent-turn call-site patch

on:
  push:
    branches:
      - fix/recent-turns-local

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/recent-turns-local
      - name: Patch one call site and remove this workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/kotlin/com/elementeracoast/app/feature/shell/CoastShellViewModel.kt')
          text = path.read_text()
          old = 'backend.chat.streamReply(conversationId, cleared, turnId, modelId).collect { progress ->'
          new = 'backend.chat.streamReply(conversationId, cleared, turnId, modelId, local.wolf.state.value.basic.recentTurns).collect { progress ->'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one call site, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          Path('.github/workflows/temp-recent-turns-line-patch.yml').unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/kotlin/com/elementeracoast/app/feature/shell/CoastShellViewModel.kt
          git rm .github/workflows/temp-recent-turns-line-patch.yml
          git commit -m 'Pass local recent turns into Native chat requests'
          git push origin HEAD:fix/recent-turns-local
