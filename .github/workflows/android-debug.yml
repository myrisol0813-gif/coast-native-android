name: Android debug native v1

on:
  push:
    branches:
      - main
      - coast-native-v1-visual-scope-00
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Guard against committed binaries and signing material
        shell: bash
        run: |
          set -euo pipefail
          bad=$(find . -type f \( -name '*.apk' -o -name '*.aab' -o -name '*.keystore' -o -name '*.jks' \) -not -path './.git/*' -print)
          if [ -n "$bad" ]; then
            echo "Forbidden binary/signing files found:"
            echo "$bad"
            exit 1
          fi

      - name: Guard against provider endpoint residue and premature network wiring
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIE 'api\.openai\.com|openrouter\.ai|api\.deepseek\.com|api\.groq\.com|api\.mistral\.ai|10\.0\.2\.2:11434' app/src app/build.gradle.kts; then
            echo 'Generic provider endpoint residue found.'
            exit 1
          fi
          if grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml; then
            echo 'INTERNET permission was added during a visual-only native pass.'
            exit 1
          fi

      - name: Verify Native v1 visual and scope contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'functions/auth.js' app/src/main/kotlin/com/elementeracoast/app/ui/brand/CoastBrandMark.kt
          grep -q 'fun ChatWindow' app/src/main/kotlin/com/elementeracoast/app/feature/chat/ChatScreen.kt
          grep -q 'fun CoastTimeline' app/src/main/kotlin/com/elementeracoast/app/feature/chat/ChatScreen.kt
          grep -q 'fun CoastComposer' app/src/main/kotlin/com/elementeracoast/app/feature/chat/InputBar.kt
          grep -q 'fun ModelQuickPicker' app/src/main/kotlin/com/elementeracoast/app/feature/chat/ModelPicker.kt
          grep -q 'fun ConversationList' app/src/main/kotlin/com/elementeracoast/app/feature/shell/MainShell.kt
          grep -q '【电波】' app/src/main/kotlin/com/elementeracoast/app/core/model/Models.kt
          grep -q '【灯塔】' app/src/main/kotlin/com/elementeracoast/app/core/model/Models.kt
          if grep -RIE 'RoomWindow|RadioScreen|LighthouseScreen' app/src/main/kotlin; then
            echo 'A separate room chat body was introduced; Native v1 requires one shared ChatWindow.'
            exit 1
          fi

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Assemble debug
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify debug APK exists without uploading it
        shell: bash
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)
          test -n "$apk"
          ls -lh "$apk"
          sha256sum "$apk"
