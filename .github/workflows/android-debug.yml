name: Android native single-source

on:
  push:
    branches: [main, coast-v1-final-closeout]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.event_name != 'push' || github.ref_name == 'main' || contains(github.event.head_commit.message, '[apk-release]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Read app version
        id: app_version
        shell: bash
        run: |
          set -euo pipefail
          version_code=$(sed -nE 's/^[[:space:]]*versionCode = ([0-9]+)[[:space:]]*$/\1/p' app/build.gradle.kts | head -n 1)
          version_name=$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)"[[:space:]]*$/\1/p' app/build.gradle.kts | head -n 1)
          test -n "$version_code"
          test -n "$version_name"
          [[ "$version_code" =~ ^[0-9]+$ ]]
          [[ "$version_name" =~ ^[A-Za-z0-9._-]+$ ]]
          {
            echo "COAST_VERSION_CODE=$version_code"
            echo "COAST_VERSION_NAME=$version_name"
          } >> "$GITHUB_ENV"
          {
            echo "version_code=$version_code"
            echo "version_name=$version_name"
          } >> "$GITHUB_OUTPUT"

      - name: Configure stable Android signing when secrets exist
        shell: bash
        env:
          COAST_ANDROID_KEYSTORE_B64: ${{ secrets.COAST_ANDROID_KEYSTORE_B64 }}
          COAST_ANDROID_KEYSTORE_PASSWORD_SECRET: ${{ secrets.COAST_ANDROID_KEYSTORE_PASSWORD }}
          COAST_ANDROID_KEY_ALIAS_SECRET: ${{ secrets.COAST_ANDROID_KEY_ALIAS }}
          COAST_ANDROID_KEY_PASSWORD_SECRET: ${{ secrets.COAST_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "${COAST_ANDROID_KEYSTORE_B64:-}" \
             && -n "${COAST_ANDROID_KEYSTORE_PASSWORD_SECRET:-}" \
             && -n "${COAST_ANDROID_KEY_ALIAS_SECRET:-}" \
             && -n "${COAST_ANDROID_KEY_PASSWORD_SECRET:-}" ]]; then
            key_path="$RUNNER_TEMP/coast-stable.jks"
            printf '%s' "$COAST_ANDROID_KEYSTORE_B64" | base64 --decode > "$key_path"
            chmod 600 "$key_path"
            {
              echo "COAST_ANDROID_KEYSTORE_PATH=$key_path"
              echo "COAST_ANDROID_KEYSTORE_PASSWORD=$COAST_ANDROID_KEYSTORE_PASSWORD_SECRET"
              echo "COAST_ANDROID_KEY_ALIAS=$COAST_ANDROID_KEY_ALIAS_SECRET"
              echo "COAST_ANDROID_KEY_PASSWORD=$COAST_ANDROID_KEY_PASSWORD_SECRET"
              echo "COAST_STABLE_SIGNING=true"
            } >> "$GITHUB_ENV"
            echo "Stable signing: configured from repository secrets."
          else
            echo "COAST_STABLE_SIGNING=false" >> "$GITHUB_ENV"
            echo "Stable signing: not configured; artifact will use the runner debug key and overwrite compatibility is NOT guaranteed."
          fi

      - name: Verify Native single-source structure
        shell: bash
        run: |
          set -euo pipefail
          root=app/src/main/kotlin/com/elementeracoast/app
          network="$root/core/network"
          auth="$root/core/auth"
          remote="$root/core/remote"
          model="$root/core/model"
          chat="$root/feature/chat"
          daily="$root/feature/daily"
          dogtalk="$root/feature/dogtalk"
          memory="$root/feature/memory"
          shell="$root/feature/shell"
          gate="$root/feature/gate"
          wolf="$root/feature/wolf"
          theme="$root/ui/theme"

          test -f "$auth/AuthSession.kt"
          test -f "$auth/AuthStore.kt"
          test -f "$auth/AuthRepository.kt"
          test -f "$network/CoastApiConfig.kt"
          test -f "$network/CoastHttpClient.kt"
          test -f "$network/CoastApiError.kt"
          test -f "$network/SseParser.kt"
          test -f "$remote/RemoteModels.kt"
          test -f "$remote/RemoteDaily.kt"
          test -f "$remote/RemoteDogtalk.kt"
          test -f "$remote/RemoteCrossWindow.kt"
          test -f "$remote/RemoteMemory.kt"
          test -f "$remote/RemoteCacheStore.kt"
          test -f "$remote/RemoteTurnContext.kt"
          test -f "$model/ModelDisplayName.kt"
          test -f "$model/CrossWindowModels.kt"
          test -f "$chat/ChatRepository.kt"
          test -f "$chat/ChatSyncMapper.kt"
          test -f "$chat/ChatHistoryMutations.kt"
          test -f "$chat/TurnDeskMapper.kt"
          test -f "$chat/TurnDeskSheet.kt"
          test -f "$daily/DailyCanonicalModels.kt"
          test -f "$daily/DailyRepository.kt"
          test -f "$daily/DailyImageCodec.kt"
          test -f "$dogtalk/DogtalkRepository.kt"
          test -f "$dogtalk/DogtalkUiState.kt"
          test -f "$dogtalk/CrossWindowRepository.kt"
          test -f "$dogtalk/CrossWindowUiState.kt"
          test -f "$memory/MemoryCanonicalModels.kt"
          test -f "$memory/MemoryRemoteDataSource.kt"
          test -f "$memory/MemoryRepository.kt"
          test -f "$memory/PendingPocketsScreen.kt"
          test -f "$shell/ConversationRepository.kt"
          test -f "$shell/ConversationTitleRemoteDataSource.kt"
          test -f "$shell/ProfileRepository.kt"
          test -f "$shell/CoastBackendGraph.kt"
          test -f "$shell/ThemeWardrobeSheet.kt"
          test -f "$theme/CoastThemePresets.kt"
          test -f app/src/main/res/mipmap-nodpi/ic_launcher_coast.png
          test ! -e app/src/main/res/drawable/ic_launcher_coast.xml
          test ! -e app/src/main/res/mipmap-nodpi/ic_launcher_coast.webp
          test ! -e "$remote/RemoteRikkaHub.kt"

          grep -q '<uses-permission android:name="android.permission.INTERNET"' app/src/main/AndroidManifest.xml
          grep -q 'android:usesCleartextTraffic="false"' app/src/main/AndroidManifest.xml
          grep -q 'android:icon="@mipmap/ic_launcher_coast"' app/src/main/AndroidManifest.xml
          grep -q 'android:roundIcon="@mipmap/ic_launcher_coast"' app/src/main/AndroidManifest.xml
          grep -q 'applicationId = "com.elementeracoast.app"' app/build.gradle.kts
          grep -Fq "versionCode = ${COAST_VERSION_CODE}" app/build.gradle.kts
          grep -Fq "versionName = \"${COAST_VERSION_NAME}\"" app/build.gradle.kts
          grep -q 'COAST_API_BASE_URL' app/build.gradle.kts
          grep -q 'https://app.elementeracoast.com' app/build.gradle.kts
          grep -q '__Host-coast_session' "$auth/AuthStore.kt"
          grep -q 'AndroidKeyStore' "$auth/AuthStore.kt"
          grep -q 'builder.header("Origin", config.origin)' "$network/CoastHttpClient.kt"
          grep -q '/api/chat/conversations' "$network/CoastApiClient.kt"
          grep -q '/api/chat/history' "$network/CoastApiClient.kt"
          grep -q '/api/chat/profile' "$network/CoastApiClient.kt"
          grep -q '/api/chat' "$network/CoastApiClient.kt"
          grep -q '/api/daily/moments' "$network/CoastApiClient.kt"
          grep -q '/api/daily/diaries' "$network/CoastApiClient.kt"
          grep -q '/api/daily/profile' "$network/CoastApiClient.kt"
          grep -q '/api/dogtalk' "$dogtalk/DogtalkRepository.kt"
          grep -q 'DefaultDogtalkRepository' "$shell/CoastBackendGraph.kt"
          grep -q '/api/chat/cross-window/sources' "$dogtalk/CrossWindowRepository.kt"
          grep -q 'DefaultCrossWindowRepository' "$shell/CoastBackendGraph.kt"
          grep -q '/api/chat/title' "$shell/ConversationTitleRemoteDataSource.kt"
          grep -q 'backend.conversations.generateTitle' "$shell/CoastShellViewModel.kt"
          grep -q '/api/memory/entries' "$memory/MemoryRemoteDataSource.kt"
          grep -q '/api/memory/pockets' "$memory/MemoryRemoteDataSource.kt"
          grep -q '/api/memory/custom-instructions' "$memory/MemoryRemoteDataSource.kt"
          grep -q '/api/worldbook' "$memory/MemoryRemoteDataSource.kt"
          grep -q 'backend.daily.refreshProfile()' "$shell/CoastShellViewModel.kt"
          grep -q 'backend.daily.cachedProfile()' "$shell/CoastShellViewModel.kt"
          grep -q 'backend.profile.setAssistantAvatar' "$shell/CoastShellViewModel.kt"
          grep -q 'assistantAvatarDataUrl' "$shell/CoastShellViewModel.kt"
          grep -q 'suspend fun setAssistantAvatar' "$shell/ProfileRepository.kt"
          grep -q 'val memory: MemoryRepository get() = backend.memory' "$shell/CoastShellViewModel.kt"
          grep -q 'val memory: MemoryRepository' "$shell/CoastBackendGraph.kt"
          grep -q 'backend.memory.refresh(memoryConversationId)' "$shell/CoastShellViewModel.kt"
          grep -q 'fun refreshCoast' "$shell/CoastShellViewModel.kt"
          grep -q 'fun sendMessage(' "$shell/CoastShellViewModel.kt"
          grep -q 'SessionRestoreResult.Offline' "$shell/CoastShellViewModel.kt"
          grep -q 'MessageAction.Retry' "$shell/CoastShellViewModel.kt"
          grep -q 'ChatHistoryMutations' "$shell/CoastShellViewModel.kt"
          grep -q 'backend.chat.persistHistory' "$shell/CoastShellViewModel.kt"
          grep -q 'val source: String = "coast"' "$remote/RemoteModels.kt"
          grep -q 'SerialName("message_source")' "$remote/RemoteModels.kt"
          grep -q 'source = value.source' "$shell/ConversationRepository.kt"
          ! grep -q 'MAX_CONTEXT_MESSAGES = 16' "$chat/ChatSyncMapper.kt"
          ! grep -q 'MAX_TURNS = 400' "$chat/ChatSyncMapper.kt"
          grep -q 'fun contextMessages(history: RemoteHistory, targetTurnId: String, recentTurns: Int)' "$chat/ChatSyncMapper.kt"
          grep -q 'ChatSyncMapper.contextMessages(historyWithUser, turnId, normalizedRecentTurns)' "$chat/ChatRepository.kt"
          grep -q 'ModelUsageFooter(' "$chat/ChatTimeline.kt"
          ! grep -q 'messageSource != "rikkahub"' "$chat/ChatSyncMapper.kt"
          grep -q 'modelDisplayName(state.currentModel)' "$shell/CoastTopBar.kt"
          grep -q '"RikkaHub"' "$shell/CoastDrawer.kt"
          grep -q '还没有导入 RikkaHub 窗口' "$shell/CoastDrawer.kt"
          ! grep -R -q 'DogtalkFixtureState' "$dogtalk"
          ! grep -q 'GateSmallEntry("更新"' "$gate/GateScreen.kt"
          grep -q 'title = "版本与更新"' "$wolf/WolfScreen.kt"
          grep -q 'BuildConfig.VERSION_NAME' "$wolf/WolfScreen.kt"

          # Context-label and turn-desk contract: cross-window is a first-class tenth source section.
          grep -q 'SerialName("external_tide")' "$remote/RemoteTurnContext.kt"
          grep -q 'ifBlank { "当前消息" }' "$chat/TurnDeskMapper.kt"
          grep -q 'ifBlank { "最近上下文" }' "$chat/TurnDeskMapper.kt"
          grep -q 'ifBlank { "核心自定义" }' "$chat/TurnDeskMapper.kt"
          grep -q 'ifBlank { "思维壤" }' "$chat/TurnDeskMapper.kt"
          grep -q 'ifBlank { "相关记忆" }' "$chat/TurnDeskMapper.kt"
          grep -q 'ifBlank { "世界书" }' "$chat/TurnDeskMapper.kt"
          grep -q 'ifBlank { "狗话" }' "$chat/TurnDeskMapper.kt"
          grep -q 'ifBlank { "跨窗口取信" }' "$chat/TurnDeskMapper.kt"
          grep -q 'ifBlank { "工作台 / 工具回执" }' "$chat/TurnDeskMapper.kt"
          grep -q 'ifBlank { "外来潮汐" }' "$chat/TurnDeskMapper.kt"
          grep -q 'TurnDeskSectionCard' "$chat/TurnDeskSheet.kt"
          grep -q 'mutableStateOf<Set<Int>>(emptySet())' "$chat/TurnDeskSheet.kt"

          # V1 closeout polish: thought-soil cards and Snow Letter composer glyphs stay centralized.
          grep -q '"当前思维壤"' "$chat/SoilSheet.kt"
          grep -q '"手持种"' "$chat/SoilSheet.kt"
          grep -q '"待确认袋"' "$chat/SoilSheet.kt"
          grep -q '"来源 / 更新时间"' "$chat/SoilSheet.kt"
          grep -q 'SnowLetterSurfaceRole.StatusCard' "$chat/SoilSheet.kt"
          grep -q 'snowLetterComposerGlyphColor' "$chat/InputBar.kt"
          grep -q 'fun snowLetterComposerGlyphColor' "$theme/SnowLetterSkins.kt"

          # Theme wardrobe keeps one persisted Native owner and the original Coast default as a preset.
          grep -q 'enum class CoastThemePreset' "$theme/CoastThemePresets.kt"
          grep -q 'CoastDefault("默认海岸", "原始默认")' "$theme/CoastThemePresets.kt"
          grep -q 'PurpleDreamTide("紫色梦潮", "紫蓝梦感")' "$theme/CoastThemePresets.kt"
          grep -q 'data class CoastThemePalette' "$theme/CoastThemePresets.kt"
          grep -q 'CoastThemePreset.entries' "$shell/ThemeWardrobeSheet.kt"
          grep -q 'ModalBottomSheet' "$shell/ThemeWardrobeSheet.kt"
          grep -q 'KEY_THEME_PRESET' "$wolf/WolfStore.kt"
          grep -q 'fun setTheme(theme: CoastThemePreset)' "$wolf/WolfStore.kt"

          test ! -e "$chat/LocalChatStore.kt"
          test ! -e "$chat/LocalFurnitureOrchestrator.kt"
          test ! -e "$network/CoastGatewayClient.kt"
          test ! -e "$daily/DailyStore.kt"
          test ! -e "$daily/DailyModels.kt"
          test ! -e "$memory/MemoryStore.kt"
          test ! -e "$memory/MemoryModels.kt"
          test ! -e app/src/test/kotlin/com/elementeracoast/app/feature/daily/DailyLocalStoreTest.kt
          test ! -e app/src/test/kotlin/com/elementeracoast/app/feature/memory/MemoryLocalStoreTest.kt
          ! grep -q 'feature.daily.DailyStore' "$shell/LocalFeatureServices.kt"
          ! grep -q 'val daily' "$shell/LocalFeatureServices.kt"
          ! grep -q 'feature.memory.MemoryStore' "$shell/LocalFeatureServices.kt"
          ! grep -q 'val memory' "$shell/LocalFeatureServices.kt"

          if grep -Eq 'RemoteDailyProfile|cachedDailyProfile|refreshDailyProfile|getDailyProfile|putDailyProfile' "$shell/ProfileRepository.kt"; then
            echo 'Daily profile ownership returned to ProfileRepository.'
            exit 1
          fi
          if grep -Eq 'daily\.myriAvatarDataUrl|daily\.xiaohanAvatarDataUrl' "$shell/CoastShellViewModel.kt"; then
            echo 'Shell profile still reads Daily profile avatars.'
            exit 1
          fi
          if grep -Eq 'runCatching \{ backend\.profile\.getProfile\(\) \}' "$shell/CoastShellViewModel.kt"; then
            echo 'Shell profile fetch still bypasses the ProfileRepository cache.'
            exit 1
          fi

          if grep -Rq 'RikkaHubChatParser\|LocalRikkaHubProvider\|RikkaHubImport' app/src/main app/src/test; then
            echo 'Native RikkaHub import implementation returned; RikkaHub must stay read-only from PWA/backend.'
            exit 1
          fi
          if grep -Rq 'rikkahub' app/src/main/kotlin/com/elementeracoast/app/feature/chat/ChatHistoryMutations.kt \
             app/src/main/kotlin/com/elementeracoast/app/feature/shell/CoastShellViewModel.kt; then
            echo 'Native message mutation path references RikkaHub and risks forking imported history.'
            exit 1
          fi
          if grep -Rq '/api/chat/rikkahub-import' "$root"; then
            echo 'Native must not expose the retired RikkaHub import route.'
            exit 1
          fi
          if grep -Eq 'putHistory\(|deleteConversation\(' "$remote/RemoteRikkaHub.kt" 2>/dev/null; then
            echo 'Native RikkaHub source must stay read-only.'
            exit 1
          fi

          # Keep one shared typed-room model: main/radio/lighthouse all use the same chat owner.
          test ! -e "$shell/RoomHub.kt"
          test ! -e "$shell/RoomThread.kt"
          ! grep -Rq '/api/room/' "$root"
          ! grep -Rq 'room_thread' "$root"
          ! grep -Rq 'roomRevision' "$root"

          # Native v1 must not re-introduce removed local selector state.
          ! grep -q 'preferredProvider\|preferredModel' "$shell/CoastShellViewModel.kt"

          # Direct dev hands belong to the shared backend registry, not a Native-only construction console.
          ! grep -Rq 'construction mode\|ConstructionMode\|developerMode\|dev tools mode\|dev_tools_mode' "$root" app/src/test
          ! grep -Rq '/api/workbench/dev' "$root"
          ! grep -Rq 'github_read_file\|github_create_branch\|notion_append_worklog' "$root"

          # Legacy owner/theme components must stay deleted.
          test ! -e "$shell/LegacyThemePicker.kt"
          test ! -e "$shell/LegacyRoomToolbar.kt"
          test ! -e "$shell/ModelDrawer.kt"

          # Retired voice/realtime surface stays absent from Native v1.
          ! grep -Rq 'SpeechRecognizer\|RecognizerIntent\|RECORD_AUDIO' "$root" app/src/main/AndroidManifest.xml

          # Keep one small activity host and one main shell owner.
          test $(wc -l < app/src/main/kotlin/com/elementeracoast/app/MainActivity.kt) -le 170
          test $(wc -l < "$shell/MainShell.kt") -le 360

          # Keep model-facing remote generation payload fields aligned with the shared backend contract.
          grep -q 'SerialName("cross_window")' "$remote/RemoteModels.kt"
          grep -q 'SerialName("recent_entry_ids")' "$remote/RemoteModels.kt"
          grep -q 'SerialName("source_turn_id")' "$remote/RemoteModels.kt"
          grep -q 'SerialName("local_date")' "$remote/RemoteModels.kt"
          grep -q 'SerialName("attachment_ids")' "$remote/RemoteModels.kt"
          grep -q 'data class RemoteAttachment' "$remote/RemoteModels.kt"
          grep -q 'suspend fun uploadChatAttachment' "$network/CoastApiClient.kt"
          grep -q 'suspend fun deleteChatAttachment' "$network/CoastApiClient.kt"
          grep -q 'fun uploadAttachment' "$shell/CoastShellViewModel.kt"
          grep -q 'fun removePendingAttachment' "$shell/CoastShellViewModel.kt"
          grep -q 'ActivityResultContracts.OpenMultipleDocuments' "$chat/ChatScreen.kt"
          grep -q 'PendingAttachmentTray' "$chat/InputBar.kt"
          grep -q '"图片"' "$chat/InputBar.kt"
          grep -q '"文件"' "$chat/InputBar.kt"
          grep -q 'PNG / JPG / WebP' "$chat/InputBar.kt"
          grep -q '文本 / MD / JSON / CSV / 代码 · 读取 ≤ 1 MB' "$chat/InputBar.kt"
          grep -q 'PDF / Office 暂不解析' "$chat/InputBar.kt"
          grep -q 'PreviewSource.Bitmap' "$chat/AttachmentCards.kt"
          grep -q 'LocalAttachmentPreviewRegistry' "$chat/AttachmentCards.kt"
          grep -q 'openrouter:web_search' "$remote/RemoteTurnContext.kt"
          grep -q 'webSearchSection' "$chat/TurnDeskMapper.kt"
          grep -q '"本轮附件"' "$chat/TurnDeskMapper.kt"
          grep -q 'ToolActivityOverlay' "$chat/ChatScreen.kt"
          grep -q '"搜索了公开网络"' "$chat/ChatScreen.kt"

          # Official MCP writes are first-class provenance, never Xiaohan/user impersonation.
          grep -q 'val messageSource: String = "coast"' "$model/ChatModels.kt"
          grep -q 'messageSource = user.messageSource' "$chat/ChatSyncMapper.kt"
          grep -q 'OfficialMcpLetter' "$chat/ChatTimeline.kt"
          grep -q 'ChatGPT-5.6 Thinking sol≋' "$chat/ChatTimeline.kt"

          # Snow Letter composer uses the same theme glyph treatment for phone / send / stop.
          grep -q 'snowLetterComposerGlyphColor' "$chat/InputBar.kt"

          # Update settings already moved to the small-wolf room; keep settings UI lean.
          ! grep -q '更新 / 小狼窝' "$shell/SettingsScreen.kt"
          ! grep -q 'settingsUpdateStatus' "$shell/SettingsScreen.kt"
          ! grep -q 'forceUpdateCheck' "$shell/SettingsScreen.kt"

          # Reject retired/prototype architectures. Native keeps one clear backend source per current feature.
          if grep -R -n -E '(compat|legacy|fallback).*(map|store|client|repository|provider|service)|(?:map|store|client|repository|provider|service).*(compat|legacy|fallback)' "$root" \
            | grep -v 'fallbackLabel' \
            | grep -v 'fallbackColor' \
            | grep -v 'fallbackShape'; then
            echo 'Compatibility/legacy/fallback architecture remains.'
            exit 1
          fi
          if find app/src/main/kotlin -type f | grep -Ei '/[^/]*(legacy|compat|bridge|temp|misc)[^/]*\.kt$'; then
            echo 'Forbidden legacy/compat/bridge/temp/misc Kotlin file found.'
            exit 1
          fi

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Assemble debug
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify built package identity and signing mode
        shell: bash
        run: |
          set -euo pipefail
          echo "Stable signing configured: ${COAST_STABLE_SIGNING:-false}"
          test "${COAST_STABLE_SIGNING:-false}" = true
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Stage debug APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          apk="artifact/CoastGPT-native-${COAST_VERSION_NAME}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$apk"
          sha256sum "$apk" > artifact/SHA256SUMS.txt
          printf 'stable_signing=%s\n' "${COAST_STABLE_SIGNING:-false}" > artifact/BUILD_INFO.txt
          printf 'versionName=%s\nversionCode=%s\napplicationId=com.elementeracoast.app\n' "$COAST_VERSION_NAME" "$COAST_VERSION_CODE" >> artifact/BUILD_INFO.txt

      - name: Upload debug APK artifact
        if: (github.event_name == 'pull_request') || (github.event_name == 'push' && github.ref_name == 'main')
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: CoastGPT-native-${{ steps.app_version.outputs.version_name }}-debug
          path: |
            artifact/CoastGPT-native-${{ steps.app_version.outputs.version_name }}-debug.apk
            artifact/SHA256SUMS.txt
            artifact/BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 7

      - name: Publish closeout APK as prerelease asset
        if: github.event_name == 'push' && (github.ref_name == 'main' || (github.ref_name == 'coast-v1-final-closeout' && contains(github.event.head_commit.message, '[apk-release]')))
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="coast-v1-closeout-native-${COAST_VERSION_CODE}"
          title="Elementera Coast Native ${COAST_VERSION_NAME}"
          apk="artifact/CoastGPT-native-${COAST_VERSION_NAME}-debug.apk"
          notes="V1 closeout signed debug APK. Stable signing: ${COAST_STABLE_SIGNING}. versionCode=${COAST_VERSION_CODE}."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" artifact/SHA256SUMS.txt artifact/BUILD_INFO.txt --clobber
          else
            gh release create "$tag" "$apk" artifact/SHA256SUMS.txt artifact/BUILD_INFO.txt               --target "$GITHUB_SHA"               --title "$title"               --notes "$notes"               --prerelease
          fi
