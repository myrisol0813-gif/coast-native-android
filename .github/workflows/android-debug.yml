name: Android debug native v1

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify Native reviewed local structure
        shell: bash
        run: |
          set -euo pipefail
          root=app/src/main/kotlin/com/elementeracoast/app
          chat="$root/feature/chat"
          test -f docs/NATIVE_APP60_SURFACE_PARITY_MAP.md
          test -f "$root/core/local/LocalPersistence.kt"
          test -f "$root/feature/wolf/WolfStore.kt"
          test -f "$root/feature/wolf/ModelCatalog.kt"
          test -f "$root/feature/wolf/ModelBoxScreen.kt"
          test -f "$root/feature/serpentdesk/SerpentDeskScreen.kt"
          test -f "$root/feature/actionlog/ActionLogStore.kt"
          test -f "$root/feature/daily/DailyStore.kt"
          test -f "$root/feature/memory/MemoryStore.kt"
          test -f "$root/feature/letters/IslandLetterStore.kt"
          test -f "$root/feature/letters/IslandLetterScreen.kt"
          test -f "$chat/LocalChatStore.kt"
          test -f "$chat/LocalFurnitureOrchestrator.kt"
          test -f "$chat/FurnitureBubble.kt"
          test -f "$chat/SoilSheet.kt"
          test -f "$root/feature/gate/GateScreen.kt"
          test -f "$root/ui/brand/CoastBrandMark.kt"
          test -f "$root/feature/shell/CoastDrawer.kt"
          test -f "$root/feature/shell/MainShell.kt"

          grep -q 'fun ChatWindow(' "$chat/ChatScreen.kt"
          grep -q 'DogtalkScope.from(state.activeRoomType)' "$chat/ChatScreen.kt"
          grep -q 'FurnitureBubble' "$chat/AssistantMessage.kt"
          grep -q '小蛇摆弄了' "$chat/FurnitureBubble.kt"
          grep -q 'FeatureDestination.ActionLog' "$root/feature/shell/CoastDrawer.kt"
          grep -q 'Serpent Desk' "$root/feature/shell/CoastDrawer.kt"
          grep -q '小蛇书桌' "$root/feature/shell/CoastDrawer.kt"
          grep -q 'SerpentDeskScreen' "$root/feature/shell/FeatureLandingScreen.kt"
          grep -q 'title = "小蛇行动日志"' "$root/feature/serpentdesk/SerpentDeskScreen.kt"
          grep -q 'FeatureDestination.IslandLetter' "$root/feature/shell/MainShell.kt"
          grep -q 'defaultIslandLetter' "$root/feature/letters/IslandLetterContent.kt"
          grep -q 'listOf("body", "true_core", "weather", "read_mode")' "$root/feature/dogtalk/DogtalkUiState.kt"
          grep -q 'val activeFieldNames' "$root/feature/wolf/WolfModels.kt"

          if grep -RIE 'FeatureDestination\.Calendar|FeatureDestination\.Desk|今日一瞥|海岸日历|一日总结|相册|Serpent Action Log|运行水闸' \
            "$root/core/model" "$root/feature/shell" "$root/feature/daily" "$root/feature/wolf"; then
            echo 'Retired Native surface returned.'
            exit 1
          fi
          if grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml; then
            echo 'Local review pass must stay offline: INTERNET permission found.'
            exit 1
          fi
          if find app/src -type f \( -name '*.ts' -o -name '*.tsx' -o -name 'package.json' \) | grep -q .; then
            echo 'TypeScript/React material found in Native source.'
            exit 1
          fi
          if find app/src/main/kotlin -type d | grep -Ei '/(legacy|compat|bridge|temp|misc)(/|$)'; then
            echo 'Forbidden legacy/compat/bridge/temp/misc source directory found.'
            exit 1
          fi
          if find app/src/main/kotlin -type f | grep -Ei '/[^/]*(legacy|compat|bridge|temp|misc)[^/]*\.kt$'; then
            echo 'Forbidden legacy/compat/bridge/temp/misc Kotlin file found.'
            exit 1
          fi

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Assemble debug
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Stage debug APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          cp app/build/outputs/apk/debug/app-debug.apk artifact/CoastGPT-native-app62-desk-fix-27-debug.apk
          sha256sum artifact/CoastGPT-native-app62-desk-fix-27-debug.apk > artifact/SHA256SUMS.txt
      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CoastGPT-native-app62-desk-fix-27-debug
          path: |
            artifact/CoastGPT-native-app62-desk-fix-27-debug.apk
            artifact/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
