name: Android native backend wiring

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configure stable Android signing when secrets exist
        shell: bash
        env:
          COAST_ANDROID_KEYSTORE_B64: ${{ secrets.COAST_ANDROID_KEYSTORE_B64 }}
          COAST_ANDROID_KEYSTORE_PASSWORD_SECRET: ${{ secrets.COAST_ANDROID_KEYSTORE_PASSWORD }}
          COAST_ANDROID_KEY_ALIAS_SECRET: ${{ secrets.COAST_ANDROID_KEY_ALIAS }}
          COAST_ANDROID_KEY_PASSWORD_SECRET: ${{ secrets.COAST_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "${COAST_ANDROID_KEYSTORE_B64:-}" \
             && -n "${COAST_ANDROID_KEYSTORE_PASSWORD_SECRET:-}" \
             && -n "${COAST_ANDROID_KEY_ALIAS_SECRET:-}" \
             && -n "${COAST_ANDROID_KEY_PASSWORD_SECRET:-}" ]]; then
            key_path="$RUNNER_TEMP/coast-stable.jks"
            printf '%s' "$COAST_ANDROID_KEYSTORE_B64" | base64 --decode > "$key_path"
            chmod 600 "$key_path"
            {
              echo "COAST_ANDROID_KEYSTORE_PATH=$key_path"
              echo "COAST_ANDROID_KEYSTORE_PASSWORD=$COAST_ANDROID_KEYSTORE_PASSWORD_SECRET"
              echo "COAST_ANDROID_KEY_ALIAS=$COAST_ANDROID_KEY_ALIAS_SECRET"
              echo "COAST_ANDROID_KEY_PASSWORD=$COAST_ANDROID_KEY_PASSWORD_SECRET"
              echo "COAST_STABLE_SIGNING=true"
            } >> "$GITHUB_ENV"
            echo "Stable signing: configured from repository secrets."
          else
            echo "COAST_STABLE_SIGNING=false" >> "$GITHUB_ENV"
            echo "Stable signing: not configured; artifact will use the runner debug key and overwrite compatibility is NOT guaranteed."
          fi

      - name: Verify Native backend wiring structure
        shell: bash
        run: |
          set -euo pipefail
          root=app/src/main/kotlin/com/elementeracoast/app
          network="$root/core/network"
          auth="$root/core/auth"
          remote="$root/core/remote"
          chat="$root/feature/chat"
          shell="$root/feature/shell"
          gate="$root/feature/gate"
          wolf="$root/feature/wolf"

          test -f "$auth/AuthSession.kt"
          test -f "$auth/AuthStore.kt"
          test -f "$auth/AuthRepository.kt"
          test -f "$network/CoastApiConfig.kt"
          test -f "$network/CoastHttpClient.kt"
          test -f "$network/CoastApiClient.kt"
          test -f "$network/CoastApiError.kt"
          test -f "$network/SseParser.kt"
          test -f "$remote/RemoteModels.kt"
          test -f "$remote/RemoteCacheStore.kt"
          test -f "$chat/ChatRepository.kt"
          test -f "$chat/ChatSyncMapper.kt"
          test -f "$shell/ConversationRepository.kt"
          test -f "$shell/ProfileRepository.kt"
          test -f "$shell/CoastBackendGraph.kt"

          grep -q '<uses-permission android:name="android.permission.INTERNET"' app/src/main/AndroidManifest.xml
          grep -q 'android:usesCleartextTraffic="false"' app/src/main/AndroidManifest.xml
          grep -q 'applicationId = "com.elementeracoast.app"' app/build.gradle.kts
          grep -q 'versionCode = 21' app/build.gradle.kts
          grep -q 'versionName = "0.1.19-backend-wiring-29"' app/build.gradle.kts
          grep -q 'COAST_API_BASE_URL' app/build.gradle.kts
          grep -q 'https://app.elementeracoast.com' app/build.gradle.kts
          grep -q '__Host-coast_session' "$auth/AuthStore.kt"
          grep -q 'AndroidKeyStore' "$auth/AuthStore.kt"
          grep -q 'builder.header("Origin", config.origin)' "$network/CoastHttpClient.kt"
          grep -q '/api/chat/conversations' "$network/CoastApiClient.kt"
          grep -q '/api/chat/history' "$network/CoastApiClient.kt"
          grep -q '/api/chat/profile' "$network/CoastApiClient.kt"
          grep -q '/api/chat' "$network/CoastApiClient.kt"
          grep -q 'fun sendMessage(' "$shell/CoastShellViewModel.kt"
          grep -q 'SessionRestoreResult.Offline' "$shell/CoastShellViewModel.kt"
          grep -q 'MessageAction.Retry' "$shell/CoastShellViewModel.kt"
          ! grep -q 'GateSmallEntry("更新"' "$gate/GateScreen.kt"
          grep -q 'title = "版本与更新"' "$wolf/WolfScreen.kt"
          grep -q 'BuildConfig.VERSION_NAME' "$wolf/WolfScreen.kt"

          test ! -e "$chat/LocalChatStore.kt"
          test ! -e "$chat/LocalFurnitureOrchestrator.kt"
          test ! -e "$network/CoastGatewayClient.kt"

          if grep -RIE 'sendFakeMessage|fakeChunks|local-mock|fake generation|fake generation' \
            "$root/MainActivity.kt" "$shell" "$chat"; then
            echo 'Retired fake chat/generation path returned.'
            exit 1
          fi
          if grep -RIE 'main-luna|main-o3|main-55t' "$root/core/model" "$shell" "$chat"; then
            echo 'Hard-coded fake conversations returned.'
            exit 1
          fi
          if grep -RIE 'Authorization:|Bearer [A-Za-z0-9_-]{12,}|OPENROUTER_API_KEY|COAST_SESSION_SECRET|COAST_PASSWORD_HASH' app/src/main; then
            echo 'A backend secret or provider credential appears to be embedded in Native source.'
            exit 1
          fi
          if grep -RIE 'println\(.*(Cookie|Authorization)|Log\.[divew].*(Cookie|Authorization)' app/src/main/kotlin; then
            echo 'Sensitive auth logging found.'
            exit 1
          fi
          if grep -R 'https://app.elementeracoast.com' app/src/main/kotlin; then
            echo 'Coast base URL must stay centralized in BuildConfig, not Kotlin source.'
            exit 1
          fi
          if find app/src -type f \( -name '*.ts' -o -name '*.tsx' -o -name 'package.json' \) | grep -q .; then
            echo 'TypeScript/React material found in Native source.'
            exit 1
          fi
          if find app/src/main/kotlin -type d | grep -Ei '/(legacy|compat|bridge|temp|misc)(/|$)'; then
            echo 'Forbidden legacy/compat/bridge/temp/misc source directory found.'
            exit 1
          fi
          if find app/src/main/kotlin -type f | grep -Ei '/[^/]*(legacy|compat|bridge|temp|misc)[^/]*\.kt$'; then
            echo 'Forbidden legacy/compat/bridge/temp/misc Kotlin file found.'
            exit 1
          fi

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Assemble debug
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify built package identity and signing mode
        shell: bash
        run: |
          set -euo pipefail
          echo "Stable signing configured: ${COAST_STABLE_SIGNING:-false}"
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Stage debug APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          apk=artifact/CoastGPT-native-backend-wiring-29-0.1.19-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk "$apk"
          sha256sum "$apk" > artifact/SHA256SUMS.txt
          printf 'stable_signing=%s\n' "${COAST_STABLE_SIGNING:-false}" > artifact/BUILD_INFO.txt
          printf 'versionName=0.1.19-backend-wiring-29\nversionCode=21\napplicationId=com.elementeracoast.app\n' >> artifact/BUILD_INFO.txt

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CoastGPT-native-backend-wiring-29-0.1.19-debug
          path: |
            artifact/CoastGPT-native-backend-wiring-29-0.1.19-debug.apk
            artifact/SHA256SUMS.txt
            artifact/BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 7
