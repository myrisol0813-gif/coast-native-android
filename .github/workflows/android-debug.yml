name: Android debug native v1

on:
  push:
    branches:
      - main
      - coast-native-gate-polish-01
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Guard against committed binaries and signing material
        shell: bash
        run: |
          set -euo pipefail
          bad=$(find . -type f \( -name '*.apk' -o -name '*.aab' -o -name '*.keystore' -o -name '*.jks' \) -not -path './.git/*' -print)
          if [ -n "$bad" ]; then
            echo "Forbidden binary/signing files found:"
            echo "$bad"
            exit 1
          fi

      - name: Guard against provider endpoint residue and premature network wiring
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIE 'api\.openai\.com|openrouter\.ai|api\.deepseek\.com|api\.groq\.com|api\.mistral\.ai|10\.0\.2\.2:11434' app/src app/build.gradle.kts; then
            echo 'Generic provider endpoint residue found.'
            exit 1
          fi
          if grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml; then
            echo 'INTERNET permission was added during a visual-only native pass.'
            exit 1
          fi

      - name: Verify Gate polish structure and frozen chat body
        shell: bash
        run: |
          set -euo pipefail
          test -f app/src/main/kotlin/com/elementeracoast/app/feature/gate/GateScreen.kt
          test -f app/src/main/kotlin/com/elementeracoast/app/feature/gate/GatePasswordField.kt
          test -f app/src/main/kotlin/com/elementeracoast/app/feature/gate/MailboxEntryDialog.kt
          test -f app/src/main/kotlin/com/elementeracoast/app/feature/gate/GateVisualTokens.kt
          test -f app/src/main/kotlin/com/elementeracoast/app/ui/brand/CoastBrandMarkAnimation.kt
          grep -q 'LoopAStartMs = 50' app/src/main/kotlin/com/elementeracoast/app/ui/brand/CoastBrandMarkAnimation.kt
          grep -q 'GateFormStartMs = 1380' app/src/main/kotlin/com/elementeracoast/app/ui/brand/CoastBrandMarkAnimation.kt
          grep -q '本轮不会发送或保存暗号' app/src/main/kotlin/com/elementeracoast/app/feature/gate/GateScreen.kt
          if ! git diff --quiet HEAD^ -- \
            app/src/main/kotlin/com/elementeracoast/app/feature/chat/ChatScreen.kt \
            app/src/main/kotlin/com/elementeracoast/app/feature/chat/InputBar.kt \
            app/src/main/kotlin/com/elementeracoast/app/feature/chat/ModelPicker.kt \
            app/src/main/kotlin/com/elementeracoast/app/feature/shell/MainShell.kt; then
            echo 'Chat/MainShell body changed during Gate-only polish.'
            exit 1
          fi

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Assemble debug
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Stage debug APK and print checksum
        shell: bash
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)
          test -n "$apk"
          mkdir -p artifact
          cp "$apk" artifact/CoastGPT-native-v1-gate-polish-debug.apk
          ls -lh artifact/CoastGPT-native-v1-gate-polish-debug.apk
          sha256sum artifact/CoastGPT-native-v1-gate-polish-debug.apk

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CoastGPT-native-v1-gate-polish-debug
          path: artifact/CoastGPT-native-v1-gate-polish-debug.apk
          if-no-files-found: error
          retention-days: 7
