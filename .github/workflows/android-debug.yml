name: Android debug native v1

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify Native app-57 structure
        shell: bash
        run: |
          set -euo pipefail
          root=app/src/main/kotlin/com/elementeracoast/app
          test -f "$root/core/model/RoomType.kt"
          test -f "$root/core/contract/CoastContracts.kt"
          test -f "$root/feature/gate/GateScreen.kt"
          test -f "$root/feature/shell/MainShell.kt"
          test -f "$root/feature/chat/ChatScreen.kt"
          test -f "$root/feature/daily/DailyLanding.kt"
          test -f "$root/feature/memory/MemoryLanding.kt"
          test ! -f "$root/core/model/Models.kt"
          grep -q 'fun ChatWindow(' "$root/feature/chat/ChatScreen.kt"
          grep -q 'DogtalkScope.from(state.activeRoomType)' "$root/feature/chat/ChatScreen.kt"
          grep -q 'listOf("body", "true_core", "weather", "read_mode")' "$root/feature/dogtalk/DogtalkUiState.kt"

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Assemble debug
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Stage debug APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          cp app/build/outputs/apk/debug/app-debug.apk artifact/CoastGPT-native-debug.apk
          sha256sum artifact/CoastGPT-native-debug.apk > artifact/SHA256SUMS.txt

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CoastGPT-native-debug
          path: |
            artifact/CoastGPT-native-debug.apk
            artifact/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
