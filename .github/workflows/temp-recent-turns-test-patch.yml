name: Temporary recent-turn test patch

on:
  push:
    branches:
      - fix/recent-turns-local

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/recent-turns-local
      - name: Patch FakeChat contract and remove this workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/src/test/kotlin/com/elementeracoast/app/feature/shell/CoastShellViewModelTest.kt')
          text = path.read_text()
          replacements = [
              ('        val vm = fixture.vm()\n\n        vm.openRoomType(RoomType.Radio)',
               '        val vm = fixture.vm()\n        vm.local.wolf.updateBasic { it.copy(recentTurns = 13) }\n\n        vm.openRoomType(RoomType.Radio)'),
              ('        assertEquals(1, fixture.chat.streamCalls)\n    }\n\n    @Test\n    fun lighthouseFirstSendPersistsUserTurnWithoutModelGeneration()',
               '        assertEquals(1, fixture.chat.streamCalls)\n        assertEquals(13, fixture.chat.lastRecentTurns)\n    }\n\n    @Test\n    fun lighthouseFirstSendPersistsUserTurnWithoutModelGeneration()'),
              ('        var failStream = false\n\n        override fun cachedHistory',
               '        var failStream = false\n        var lastRecentTurns = 0\n\n        override fun cachedHistory'),
              ('            turnId: String,\n            modelId: String\n        ): Flow<ChatProgress> = flow {\n            streamCalls += 1',
               '            turnId: String,\n            modelId: String,\n            recentTurns: Int\n        ): Flow<ChatProgress> = flow {\n            streamCalls += 1\n            lastRecentTurns = recentTurns')
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'expected one match, found {text.count(old)} for {old[:60]!r}')
              text = text.replace(old, new)
          path.write_text(text)
          Path('.github/workflows/temp-recent-turns-test-patch.yml').unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/test/kotlin/com/elementeracoast/app/feature/shell/CoastShellViewModelTest.kt
          git rm .github/workflows/temp-recent-turns-test-patch.yml
          git commit -m 'Verify Native local recent turns reach chat requests'
          git push origin HEAD:fix/recent-turns-local
