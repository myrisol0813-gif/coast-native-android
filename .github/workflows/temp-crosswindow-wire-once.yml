name: Temporary cross-window Native wiring

on:
  push:
    branches: [feature/coast-dogtalk-crosswindow-01]
    paths: [.github/workflows/temp-crosswindow-wire-once.yml]

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/coast-dogtalk-crosswindow-01
      - name: Apply one-shot structural wiring
        shell: bash
        run: |
          python .github/temp/crosswindow_wire.py
          git rm .github/workflows/temp-crosswindow-wire-once.yml .github/temp/crosswindow_wire.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Wire Native cross-window selection through chat turns"
          git push origin HEAD:feature/coast-dogtalk-crosswindow-01
