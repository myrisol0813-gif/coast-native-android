name: Temporary Native context callsite patch

on:
  push:
    branches:
      - fix/remove-native-context-caps-0138

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/remove-native-context-caps-0138
      - name: Patch explicit recent-turn callsite
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/kotlin/com/elementeracoast/app/feature/shell/CoastShellViewModel.kt')
          text = path.read_text()
          old = 'ChatSyncMapper.contextMessages(cleared, turnId)'
          new = 'ChatSyncMapper.contextMessages(cleared, turnId, local.wolf.state.value.basic.recentTurns)'
          if old in text:
              path.write_text(text.replace(old, new, 1))
          elif new not in text:
              raise SystemExit('expected contextMessages callsite not found')
          PY
      - name: Commit patch when needed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/kotlin/com/elementeracoast/app/feature/shell/CoastShellViewModel.kt
          git commit -m "Pass local recent-turn setting to title context lookup"
          git push origin HEAD:fix/remove-native-context-caps-0138
